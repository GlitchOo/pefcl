name: Tagged Release
on:
  push:
    tags:
      - 'v*'
jobs:
  create-tagged-release:
    name: 'Build & Create Release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/package-lock.json
            web/package-lock.json

      - name: Get variables
        id: get_vars
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c 1-7)
          echo "GITHUB_SHA_SHORT=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Install main deps
        run: npm ci --ignore-scripts

      - name: Pull Crowdin translations
        continue-on-error: true
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          create_pull_request: false
          push_translations: false
          skip_untranslated_strings: true
          skip_untranslated_files: true
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate locale index
        run: npm run translations:generate-index

      - name: Install src deps
        working-directory: src
        run: npm ci

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Package release zip
        run: |
          chmod +x ./scripts/release.sh
          ./scripts/release.sh

      - name: Create Release & Changelog
        uses: 'marvinpinto/action-automatic-releases@v1.2.1'
        id: auto_release
        with:
          repo_token: '${{ secrets.GITHUB_TOKEN }}'
          title: PEFCL Release | (${{ steps.get_vars.outputs.VERSION_TAG }})
          prerelease: false
          files: ./temp/pefcl.zip

        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
