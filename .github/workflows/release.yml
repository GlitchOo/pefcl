name: Tagged Release
on:
  push:
    tags:
      - 'v*'
jobs:
  create-tagged-release:
    name: 'Build & Create Release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/package-lock.json
            web/package-lock.json

      - name: Get variables
        id: get_vars
        run: |
          echo "GITHUB_SHA_SHORT=$(echo $GITHUB_SHA | cut -c 1-7)" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=$(echo ${GITHUB_REF/refs\/tags\//})" >> $GITHUB_OUTPUT

      - name: Install main deps
        run: npm ci --ignore-scripts

      - name: Translations
        env:
          LOCALAZY_READ_KEY: ${{ secrets.LOCALAZY_READ_KEY }}
        run: npm run translations:pull

      - name: Install src deps
        working-directory: src
        run: npm ci --ignore-scripts

      - name: Install web deps
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Create release
        run: |
          chmod +x "./scripts/release.sh"
          npm run release

      - name: Create Release & Changelog
        uses: 'marvinpinto/action-automatic-releases@v1.2.1'
        id: auto_release
        with:
          repo_token: '${{ secrets.GITHUB_TOKEN }}'
          title: PEFCL Release | (${{ steps.get_vars.outputs.VERSION_TAG }})
          prerelease: false
          files: ./temp/pefcl.zip

        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
