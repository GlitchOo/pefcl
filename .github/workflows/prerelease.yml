name: Prerelease Publisher
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  pre-release-build:
    name: 'Build & Create Pre-Release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/package-lock.json
            web/package-lock.json

      - name: Get variables
        id: get_vars
        run: |
          echo "GITHUB_SHA_SHORT=$(echo $GITHUB_SHA | cut -c 1-7)" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT

      - name: Install main deps
        run: npm ci --ignore-scripts

      - name: Pull Crowdin translations
        continue-on-error: true
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          create_pull_request: false
          push_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate locale index
        run: npm run translations:generate-index

      - name: Install src deps
        working-directory: src
        run: npm ci --ignore-scripts

      - name: Install web deps
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Create pre-release
        run: |
          chmod +x "./scripts/prerelease.sh"
          npm run pre-release

      - name: Create Release & Changelog
        uses: 'marvinpinto/action-automatic-releases@v1.2.1'
        with:
          repo_token: '${{ secrets.GITHUB_TOKEN }}'
          title: Pre-Release Build (${{ steps.get_vars.outputs.SHORT_SHA }})
          prerelease: true
          automatic_release_tag: unstable-${{ steps.get_vars.outputs.BRANCH_NAME }}
          files: ./temp/pefcl-pre-${{ steps.get_vars.outputs.SHORT_SHA }}.zip

        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
