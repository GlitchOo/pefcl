name: Translations
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'locales/en/default.json'
      - 'crowdin.yml'
      - '.github/workflows/translations.yml'

jobs:
  sync:
    name: Sync sources and translations to Crowdin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Extract English source strings
        run: |
          npm run translations:generate
          npm run translations:generate-index

      - name: Upload sources and existing translations to Crowdin
        continue-on-error: true
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: true
          download_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
