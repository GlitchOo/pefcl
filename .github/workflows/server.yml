name: Tests - Server & Client
on:
  push:
    branches:
      - '**'

jobs:
  test:
    name: Testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/package-lock.json
      - name: Install deps (Translations)
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Generate translations
        working-directory: .
        run: |
          npm run translations:generate
          npm run translations:generate-index
      - name: Install deps
        run: npm ci --ignore-scripts
      - name: Linting
        run: npm run lint
      - name: Type checking
        run: npm run tsc
